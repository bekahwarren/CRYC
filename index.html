<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRYC Volunteer Scheduler</title><link rel="stylesheet" href="styles.css"></head><body><div id="login" class="center"><div class="card login"><div class="eyebrow">CELEBRATE RECOVERY</div><h1>Yuba City Volunteer Scheduler</h1><p>Enter your 4-digit PIN</p><input id="pin" inputmode="numeric" maxlength="4" placeholder="••••"><button id="loginBtn">Log in</button><div id="loginMsg" class="error"></div></div></div><div id="app" hidden><header><div><div class="eyebrow">CELEBRATE RECOVERY · YUBA CITY</div><b id="hello"></b></div><nav><button data-view="schedule" class="active">Schedule</button><button data-view="volunteers">Volunteers</button><button data-view="settings">Settings</button><button id="logout">Log out</button></nav></header><main><section id="schedule" class="view"><div class="toolbar"><select id="teamFilter"></select><button id="prev">◀</button><button id="today">Today</button><button id="next">▶</button><button id="capture">📸 Capture</button></div><div id="weeks"></div><h2>On Call</h2><div id="oncall"></div></section><section id="volunteers" class="view" hidden><div class="titleRow"><h2>Volunteers</h2><button id="addVolunteer">+ Add Volunteer</button></div><div id="volunteerList"></div></section><section id="settings" class="view" hidden><h2>Settings</h2><div id="myAccount"></div><div id="userAdmin"></div><div id="teamSettings"></div></section></main></div><dialog id="modal"><form method="dialog" id="modalForm"><div id="modalBody"></div><div class="actions"><button value="cancel">Cancel</button><button id="modalSave" value="default">Save</button></div></form></dialog><dialog id="captureModal"><div class="captureHead"><div><div class="eyebrow">CELEBRATE RECOVERY · YUBA CITY</div><h2>Volunteer Schedule</h2></div><button onclick="captureModal.close()">Close</button></div><div class="toolbar"><select id="captureTeam"></select><button id="capturePrev">◀ 4 weeks</button><button id="captureNext">Next 4 weeks ▶</button></div><div id="captureGrid"></div><p class="hint">Screenshot this view to share with your volunteer team.</p></dialog><script src="app.js"></script><script src="volunteer-groups.js"></script></body></html>
